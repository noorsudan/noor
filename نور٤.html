<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجر نور للملابس | Noor Clothes Store</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

<script>
tailwind.config={theme:{extend:{
  fontFamily:{tajawal:['Tajawal','sans-serif']},
  colors:{gold:{50:'#fffdf2',100:'#fdf6d8',200:'#fbecab',300:'#f7dc74',400:'#f0c445',500:'#e0a72a',600:'#c4881c',700:'#9c6618',800:'#7c501b',900:'#66421a'}}
}}}
</script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;overflow-x:hidden;background:#0d0a04;color:#fdf6d8}

/* ============ الخلفية ============ */
.bg-static{position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(circle at 15% 18%,rgba(240,196,69,.13) 0%,transparent 42%),
    radial-gradient(circle at 85% 78%,rgba(196,136,28,.12) 0%,transparent 45%),
    radial-gradient(circle at 55% 45%,rgba(253,246,216,.035) 0%,transparent 55%),
    linear-gradient(165deg,#0b0803 0%,#160f05 48%,#0b0803 100%)}
.bg-glow{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(circle at 50% 30%,rgba(240,196,69,.09) 0%,transparent 55%);
  opacity:.5;animation:softGlow 26s ease-in-out infinite;will-change:opacity}
@keyframes softGlow{0%,100%{opacity:.35}50%{opacity:.75}}
@media(prefers-reduced-motion:reduce){.bg-glow{animation:none}}

/* ============ شاشة البداية (Splash) ============ */
#splashScreen{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 50%,#1a1206,#0d0a04);transition:opacity .8s ease,visibility .8s ease}
#splashScreen.gone{opacity:0;visibility:hidden;pointer-events:none}

.splash-crown{font-size:3.5rem;opacity:0;transform:scale(.3) rotate(-30deg);
  animation:crownIn .8s cubic-bezier(.34,1.56,.64,1) .3s forwards;
  background:linear-gradient(135deg,#fdf6d8,#f0c445 45%,#c4881c);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 25px rgba(240,196,69,.5))}
@keyframes crownIn{to{opacity:1;transform:scale(1) rotate(0)}}

.splash-title{font-size:5rem;font-weight:900;opacity:0;
  background:linear-gradient(135deg,#fdf6d8,#f0c445 40%,#c4881c,#f7dc74);
  background-size:300% 300%;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:titleIn .9s cubic-bezier(.34,1.56,.64,1) .9s forwards,shimmer 3s ease-in-out 1.8s infinite;
  filter:drop-shadow(0 0 30px rgba(240,196,69,.4))}
@keyframes titleIn{to{opacity:1}}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

.splash-sub{font-size:1.25rem;opacity:0;color:rgba(253,246,216,.55);letter-spacing:.08em;
  animation:subIn .7s ease 1.5s forwards}
@keyframes subIn{to{opacity:1}}

.splash-line{width:0;height:3px;border-radius:4px;margin:0 auto;
  background:linear-gradient(90deg,transparent,#f0c445,transparent);
  animation:lineGrow 1.2s ease 1.8s forwards}
@keyframes lineGrow{to{width:180px}}

.splash-dots{display:flex;gap:8px;margin-top:2rem;opacity:0;animation:dotsIn .5s ease 2.3s forwards}
@keyframes dotsIn{to{opacity:1}}
.splash-dot{width:8px;height:8px;border-radius:50%;background:rgba(240,196,69,.35);
  animation:dotPulse 1.4s ease-in-out infinite}
.splash-dot:nth-child(2){animation-delay:.2s}
.splash-dot:nth-child(3){animation-delay:.4s}
@keyframes dotPulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2);background:#f0c445}}

/* ============ الصفحات ============ */
.page{transition:opacity .5s ease,transform .5s ease}
.page-hidden{opacity:0;transform:translateY(24px);pointer-events:none;position:absolute;width:100%}
.page-visible{opacity:1;transform:none}

/* ============ أزرار الفروع ============ */
.branch-btn{position:relative;overflow:hidden;background:rgba(255,255,255,.045);
  border:1px solid rgba(240,196,69,.18);transition:transform .25s,border-color .25s,background .25s,box-shadow .25s}
.branch-btn:hover{transform:translateY(-6px);background:rgba(240,196,69,.09);
  border-color:rgba(240,196,69,.6);box-shadow:0 16px 44px rgba(224,167,42,.22)}
.branch-btn .icon-wrap{transition:transform .25s}
.branch-btn:hover .icon-wrap{transform:scale(1.12)}

/* ============ بطاقة المنتج ============ */
.product-card{background:rgba(255,255,255,.04);border:1px solid rgba(240,196,69,.14);
  transition:transform .25s,border-color .25s,box-shadow .25s;overflow:hidden}
.product-card:hover{transform:translateY(-6px);border-color:rgba(240,196,69,.5);
  box-shadow:0 16px 42px rgba(0,0,0,.45)}

.thumb{position:relative;background:linear-gradient(145deg,rgba(240,196,69,.16),rgba(124,80,27,.10) 60%,rgba(0,0,0,.15));
  overflow:hidden;border-bottom:1px solid rgba(240,196,69,.14)}
.thumb::before{content:'';position:absolute;inset:0;opacity:.35;
  background:repeating-linear-gradient(45deg,rgba(253,246,216,.045) 0 2px,transparent 2px 12px)}
.thumb::after{content:'';position:absolute;width:150px;height:150px;border-radius:50%;
  top:-45px;left:-45px;background:radial-gradient(circle,rgba(240,196,69,.22),transparent 70%)}
.thumb i{position:relative;z-index:2;font-size:3.2rem;
  background:linear-gradient(135deg,#fdf6d8,#f0c445 45%,#b8790f);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 4px 10px rgba(224,167,42,.35));transition:transform .25s}
.product-card:hover .thumb i{transform:scale(1.12)}

.add-btn{opacity:.55;transition:opacity .25s}
.product-card:hover .add-btn{opacity:1}
@media(max-width:768px){.add-btn{opacity:1}}

/* ============ النافذة ============ */
.modal-overlay{transition:opacity .3s}
.modal-overlay.hidden{opacity:0;pointer-events:none}
.modal-content{transition:transform .35s cubic-bezier(.34,1.4,.64,1),opacity .3s}
.modal-overlay.hidden .modal-content{transform:scale(.92) translateY(20px);opacity:0}

.modal-thumb{background:linear-gradient(145deg,rgba(240,196,69,.2),rgba(124,80,27,.12) 60%,rgba(0,0,0,.2));position:relative;overflow:hidden}
.modal-thumb::before{content:'';position:absolute;inset:0;opacity:.3;
  background:repeating-linear-gradient(45deg,rgba(253,246,216,.05) 0 2px,transparent 2px 14px)}
.modal-thumb i{position:relative;z-index:2;font-size:5.5rem;
  background:linear-gradient(135deg,#fdf6d8,#f0c445 45%,#b8790f);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 6px 16px rgba(224,167,42,.4))}

/* ============ أزرار ============ */
.size-btn{transition:all .2s;border:2px solid rgba(240,196,69,.22);background:rgba(255,255,255,.04)}
.size-btn:hover{border-color:rgba(240,196,69,.55);background:rgba(240,196,69,.1)}
.size-btn.active{border-color:#f0c445;background:rgba(240,196,69,.25);box-shadow:0 0 14px rgba(240,196,69,.3)}
.color-option{transition:transform .2s,border-color .2s;cursor:pointer;border:3px solid transparent}
.color-option:hover{transform:scale(1.15)}
.color-option.active{border-color:#f0c445;transform:scale(1.18);box-shadow:0 0 14px rgba(240,196,69,.5)}
.qty-btn{transition:background .2s,border-color .2s}
.qty-btn:hover{background:rgba(240,196,69,.22);border-color:rgba(240,196,69,.4)}
.qty-btn:active{transform:scale(.92)}

/* ============ الشريط العلوي ============ */
.navbar{background:rgba(11,8,3,.9);backdrop-filter:blur(14px);border-bottom:1px solid rgba(240,196,69,.15)}
.logo-text{background:linear-gradient(135deg,#fdf6d8,#f0c445 40%,#c4881c);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

.gold-btn{background:linear-gradient(135deg,#f7dc74,#f0c445 42%,#c4881c);color:#1e1406;
  transition:transform .2s,box-shadow .2s}
.gold-btn:hover{box-shadow:0 10px 28px rgba(224,167,42,.35);transform:translateY(-2px)}
.gold-btn:active{transform:translateY(0)}

/* ============ الزر العائم ============ */
.fab-cart{position:fixed;bottom:22px;left:22px;z-index:75}
.fab-cart button{width:60px;height:60px;border-radius:50%;
  background:linear-gradient(135deg,#f7dc74,#f0c445 45%,#b8790f);color:#1b1206;
  box-shadow:0 10px 28px rgba(224,167,42,.42);transition:transform .25s}
.fab-cart button:hover{transform:scale(1.07)}

/* ============ لوحة السلة ============ */
.cart-panel{position:fixed;bottom:94px;left:22px;width:376px;max-height:68vh;z-index:74;
  display:flex;flex-direction:column;transform-origin:bottom left;
  background:rgba(17,12,5,.96);backdrop-filter:blur(18px);
  border:1px solid rgba(240,196,69,.3);border-radius:22px;overflow:hidden;
  box-shadow:0 22px 60px rgba(0,0,0,.6);
  transition:opacity .28s ease,transform .32s cubic-bezier(.34,1.4,.64,1)}
.cart-panel.closed{opacity:0;transform:translateY(20px) scale(.9);pointer-events:none}
@media(max-width:640px){.cart-panel{left:12px;right:12px;width:auto;max-height:74vh}}

.cart-item{background:rgba(255,255,255,.045);border:1px solid rgba(240,196,69,.12);transition:background .2s}
.cart-item:hover{background:rgba(240,196,69,.07)}
.mini-thumb{background:linear-gradient(145deg,rgba(240,196,69,.2),rgba(124,80,27,.12));border:1px solid rgba(240,196,69,.2)}
.mini-thumb i{color:#f0c445;font-size:1.35rem}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:rgba(255,255,255,.03)}
::-webkit-scrollbar-thumb{background:rgba(240,196,69,.45);border-radius:10px}

.badge-pop{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}

.toast{animation:tIn .3s ease,tOut .35s ease 2.5s forwards}
@keyframes tIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes tOut{to{opacity:0;transform:translateY(-14px)}}

.whatsapp-btn{background:linear-gradient(135deg,#25d366,#0e7a5f);
  border:1px solid rgba(240,196,69,.3);transition:transform .2s,box-shadow .2s}
.whatsapp-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(37,211,102,.3)}

.form-input{background:rgba(255,255,255,.05);border:1px solid rgba(240,196,69,.22);color:#fdf6d8;transition:border-color .2s,box-shadow .2s}
.form-input:focus{border-color:#f0c445;box-shadow:0 0 14px rgba(240,196,69,.2);outline:none}
.form-input::placeholder{color:rgba(253,246,216,.4)}

.branch-dropdown{background:rgba(17,12,5,.97);backdrop-filter:blur(14px);border:1px solid rgba(240,196,69,.22)}
.branch-dropdown-item{transition:background .18s}
.branch-dropdown-item:hover{background:rgba(240,196,69,.15);color:#f7dc74}

.line-clamp-1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.deliv-chip{background:rgba(240,196,69,.12);border:1px solid rgba(240,196,69,.3)}

/* ============ ظهور بطاقات الفروع واحدة واحدة ============ */
.branch-reveal{opacity:0;transform:translateY(24px) scale(.95)}
.branch-reveal.show{opacity:1;transform:none;transition:opacity .45s ease,transform .45s ease}

@media(max-width:480px){
  .splash-title{font-size:3.2rem}
  .splash-crown{font-size:2.5rem}
  .splash-sub{font-size:1rem}
}
</style>
</head>

<body class="font-tajawal min-h-screen">

<div class="bg-static"></div>
<div class="bg-glow"></div>

<!-- ==================== شاشة البداية (Splash) ==================== -->
<div id="splashScreen">
  <div class="flex flex-col items-center justify-center text-center px-6">
    <div class="splash-crown mb-4"><i class="fas fa-crown"></i></div>
    <h1 class="splash-title">نور</h1>
    <p class="splash-sub">للملابس العصرية</p>
    <div class="splash-line mt-5"></div>
    <div class="splash-dots">
      <div class="splash-dot"></div>
      <div class="splash-dot"></div>
      <div class="splash-dot"></div>
    </div>
  </div>
</div>

<div id="toastContainer" class="fixed top-24 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 items-center pointer-events-none"></div>

<!-- ==================== صفحة الفروع ==================== -->
<div id="branchPage" class="page page-hidden min-h-screen flex items-center justify-center px-4 py-10" style="visibility:hidden">
  <div class="max-w-4xl w-full text-center">
    <div class="mb-10">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-gradient-to-br from-gold-300 via-gold-400 to-gold-700 mb-5 shadow-2xl shadow-gold-600/30">
        <i class="fas fa-crown text-3xl text-[#2a1c07]"></i>
      </div>
      <h1 class="text-5xl md:text-7xl font-black logo-text mb-3">متجر نور</h1>
      <p class="text-xl text-gold-200/70">للملابس العصرية</p>
      <div class="w-28 h-[3px] bg-gradient-to-r from-transparent via-gold-400 to-transparent mx-auto mt-5 rounded-full"></div>
    </div>

    <div class="mb-7">
      <h2 class="text-2xl md:text-3xl font-bold mb-2"><i class="fas fa-map-marker-alt text-gold-400 ml-2"></i>اختر فرعك المفضل</h2>
      <p class="text-gold-100/45">حدد أقرب فرع إليك لبدء التسوق</p>
    </div>

    <div id="branchGrid" class="grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-5"></div>

    <div class="mt-10 text-gold-100/25 text-sm">© 2025 متجر نور للملابس — جميع الحقوق محفوظة</div>
  </div>
</div>

<!-- ==================== صفحة المنتجات ==================== -->
<div id="productsPage" class="page page-hidden min-h-screen">
  <nav id="navbar" class="navbar fixed top-0 inset-x-0 z-50 px-4 md:px-8 py-3">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5 cursor-pointer" onclick="goToBranchPage()">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-gold-300 to-gold-700 flex items-center justify-center">
          <i class="fas fa-crown text-[#2a1c07] text-sm"></i></div>
        <h1 class="text-lg md:text-xl font-bold logo-text">متجر نور</h1>
      </div>

      <div class="relative" id="branchWrap">
        <button onclick="toggleBranchDD(event)" class="flex items-center gap-2 px-3 md:px-4 py-2 rounded-xl bg-gold-400/10 border border-gold-400/25 hover:bg-gold-400/20 transition text-sm">
          <i class="fas fa-map-marker-alt text-gold-400"></i>
          <span id="currentBranchLabel" class="font-medium">الخرطوم</span>
          <i class="fas fa-chevron-down text-gold-200/50 text-[10px]"></i>
        </button>
        <div id="branchDropdown" class="branch-dropdown absolute top-full mt-2 right-0 w-56 rounded-xl overflow-hidden shadow-2xl hidden z-50"></div>
      </div>

      <button onclick="toggleCart(event)" class="relative flex items-center gap-2 px-3 md:px-4 py-2 rounded-xl bg-gold-400/10 border border-gold-400/25 hover:bg-gold-400/20 transition">
        <i class="fas fa-shopping-bag text-gold-400"></i>
        <span class="hidden md:inline text-sm font-medium">السلة</span>
        <span id="cartCount" class="absolute -top-2 -left-2 bg-gradient-to-r from-gold-300 to-gold-600 text-[#2a1c07] text-[11px] w-5 h-5 rounded-full flex items-center justify-center font-bold hidden">0</span>
      </button>
    </div>
  </nav>

  <div class="pt-24 pb-32 px-4 md:px-8">
    <div class="max-w-7xl mx-auto">
      <div class="text-center mb-8">
        <h2 class="text-2xl md:text-4xl font-black mb-3">تشكيلة فرع <span id="branchTitle" class="logo-text">الخرطوم</span></h2>
        <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full deliv-chip text-sm">
          <i class="fas fa-truck-fast text-gold-400"></i>
          <span class="text-gold-100/80">رسوم التوصيل:</span>
          <b id="branchDeliveryLabel" class="text-gold-300">0 ج.س</b>
        </div>
        <div class="w-24 h-[3px] bg-gradient-to-r from-transparent via-gold-400 to-transparent mx-auto mt-5 rounded-full"></div>
      </div>

      <div class="flex flex-wrap justify-center gap-2.5 mb-9">
        <button onclick="filterCategory('all')" data-category="all" class="category-btn px-5 py-2 rounded-full text-sm font-medium transition">الكل</button>
        <button onclick="filterCategory('men')" data-category="men" class="category-btn px-5 py-2 rounded-full text-sm font-medium transition">رجالي</button>
        <button onclick="filterCategory('women')" data-category="women" class="category-btn px-5 py-2 rounded-full text-sm font-medium transition">نسائي</button>
        <button onclick="filterCategory('kids')" data-category="kids" class="category-btn px-5 py-2 rounded-full text-sm font-medium transition">أطفال</button>
        <button onclick="filterCategory('accessories')" data-category="accessories" class="category-btn px-5 py-2 rounded-full text-sm font-medium transition">إكسسوارات</button>
      </div>

      <div id="productsGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-5"></div>
    </div>
  </div>
</div>

<!-- ==================== نافذة المنتج ==================== -->
<div id="productModal" class="modal-overlay hidden fixed inset-0 z-[90] flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm">
  <div class="modal-content relative bg-[#120c05]/98 rounded-3xl max-w-lg w-full max-h-[90vh] overflow-y-auto border border-gold-400/30 shadow-2xl">
    <button onclick="closeProductModal()" class="absolute top-4 left-4 w-9 h-9 rounded-full bg-black/60 border border-gold-400/30 flex items-center justify-center text-gold-200 hover:bg-gold-400/25 transition z-10">
      <i class="fas fa-times"></i></button>

    <div class="modal-thumb h-44 md:h-52 flex items-center justify-center rounded-t-3xl">
      <i id="modalIcon" class="fas fa-shirt"></i>
    </div>

    <div class="p-6 space-y-6">
      <div>
        <span id="modalCat" class="inline-block px-3 py-1 rounded-full text-[11px] font-bold mb-2 bg-gold-400/15 border border-gold-400/30 text-gold-200"></span>
        <h3 id="modalProductName" class="text-2xl font-bold mb-1"></h3>
        <p id="modalProductPrice" class="text-2xl font-black text-gold-400"></p>
      </div>

      <div>
        <label class="font-bold text-sm mb-3 block"><i class="fas fa-ruler-combined text-gold-400 ml-2"></i>اختر المقاس</label>
        <div class="flex flex-wrap gap-3">
          <button onclick="selSize(this,'S')" class="size-btn w-12 h-12 rounded-xl font-bold text-sm">S</button>
          <button onclick="selSize(this,'M')" class="size-btn w-12 h-12 rounded-xl font-bold text-sm">M</button>
          <button onclick="selSize(this,'L')" class="size-btn w-12 h-12 rounded-xl font-bold text-sm">L</button>
          <button onclick="selSize(this,'XL')" class="size-btn w-12 h-12 rounded-xl font-bold text-sm">XL</button>
          <button onclick="selSize(this,'XXL')" class="size-btn w-12 h-12 rounded-xl font-bold text-sm">XXL</button>
        </div>
      </div>

      <div>
        <label class="font-bold text-sm mb-3 block"><i class="fas fa-palette text-gold-400 ml-2"></i>اختر اللون</label>
        <div class="flex flex-wrap gap-3">
          <button onclick="selColor(this,'ذهبي')" class="color-option w-10 h-10 rounded-full" style="background:linear-gradient(135deg,#f7dc74,#c4881c)" title="ذهبي"></button>
          <button onclick="selColor(this,'أسود')" class="color-option w-10 h-10 rounded-full bg-gray-900" title="أسود"></button>
          <button onclick="selColor(this,'أبيض')" class="color-option w-10 h-10 rounded-full bg-white" title="أبيض"></button>
          <button onclick="selColor(this,'بيج')" class="color-option w-10 h-10 rounded-full bg-amber-200" title="بيج"></button>
          <button onclick="selColor(this,'بني')" class="color-option w-10 h-10 rounded-full bg-amber-800" title="بني"></button>
          <button onclick="selColor(this,'أحمر')" class="color-option w-10 h-10 rounded-full bg-red-600" title="أحمر"></button>
          <button onclick="selColor(this,'أزرق')" class="color-option w-10 h-10 rounded-full bg-blue-600" title="أزرق"></button>
          <button onclick="selColor(this,'أخضر')" class="color-option w-10 h-10 rounded-full bg-emerald-600" title="أخضر"></button>
        </div>
      </div>

      <div>
        <label class="font-bold text-sm mb-3 block"><i class="fas fa-layer-group text-gold-400 ml-2"></i>الكمية</label>
        <div class="flex items-center gap-4">
          <button onclick="chgQty(-1)" class="qty-btn w-12 h-12 rounded-xl bg-white/5 border border-gold-400/20 flex items-center justify-center"><i class="fas fa-minus text-sm"></i></button>
          <span id="modalQty" class="text-2xl font-bold w-12 text-center">1</span>
          <button onclick="chgQty(1)" class="qty-btn w-12 h-12 rounded-xl bg-white/5 border border-gold-400/20 flex items-center justify-center"><i class="fas fa-plus text-sm"></i></button>
        </div>
      </div>

      <button onclick="addToCart()" class="gold-btn w-full py-4 rounded-2xl font-black text-lg flex items-center justify-center gap-3">
        <i class="fas fa-cart-plus text-xl"></i><span>إضافة إلى السلة</span>
      </button>
    </div>

 {id:45,name:'ملابس بحر أطفال',price:2200,category:'kids',icon:'fa-child'},

 {id:48,name:'جاكيت خفيف للرياح',price:5500,category:'men',icon:'fa-vest-patches'}]
};

let selectedBranch='',cart=[],currentProduct=null,
    selectedSize='',selectedColor='',quantity=1,cartOpen=false,activeCat='all';

/* ============ شاشة البداية ============ */
window.addEventListener('load',()=>{
  setTimeout(()=>{
    const splash=document.getElementById('splashScreen');
    splash.classList.add('gone');
    const bp=document.getElementById('branchPage');
    bp.style.visibility='visible';
    bp.classList.replace('page-hidden','page-visible');
    // ظهور بطاقات الفروع واحدة تلو الأخرى
    document.querySelectorAll('.branch-reveal').forEach((el,i)=>{
      setTimeout(()=>el.classList.add('show'),120*i);
    });
    setTimeout(()=>splash.remove(),900);
  },3600);
});

/* ============ بناء واجهة الفروع (بدون سعر توصيل) ============ */
branchGrid.innerHTML=branches.map(b=>`
  <button onclick="selectBranch('${b.name}')" class="branch-btn branch-reveal rounded-2xl p-5 md:p-6 group">
    <div class="icon-wrap inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-gold-400/25 to-gold-700/15 mb-3">
      <i class="fas ${b.icon} text-2xl text-gold-300"></i></div>
    <h3 class="text-base md:text-lg font-bold">${b.name}</h3>
    <p class="text-gold-100/35 text-xs mt-0.5">${b.desc}</p>
  </button>`).join('');

branchDropdown.innerHTML=branches.map(b=>`
  <button onclick="changeBranch('${b.name}')" class="branch-dropdown-item w-full flex items-center justify-between px-4 py-2.5 text-sm">
    <span>${b.name}</span><span class="text-[11px] text-gold-300">${money(b.delivery)}</span>
  </button>`).join('');

/* ============ التنقل ============ */
function selectBranch(b){
  selectedBranch=b; syncUI();
  branchPage.classList.replace('page-visible','page-hidden');
  setTimeout(()=>{
    productsPage.classList.replace('page-hidden','page-visible');
    fabCart.style.display='block';
    activeCat='all'; renderCats(); renderProducts(); updateCartUI();
    window.scrollTo(0,0);
  },260);
}
function goToBranchPage(){
  closeCart(); fabCart.style.display='none';
  productsPage.classList.replace('page-visible','page-hidden');
  setTimeout(()=>{
    branchPage.classList.replace('page-hidden','page-visible');
    document.querySelectorAll('.branch-reveal').forEach((el,i)=>{
      el.classList.remove('show');
      setTimeout(()=>el.classList.add('show'),100*i);
    });
  },260);
}
function syncUI(){
  currentBranchLabel.textContent=selectedBranch;
  branchTitle.textContent=selectedBranch;
  branchDeliveryLabel.textContent=money(deliveryOf(selectedBranch));
}
function toggleBranchDD(e){e.stopPropagation();branchDropdown.classList.toggle('hidden');}
function changeBranch(b){
  selectedBranch=b; syncUI(); branchDropdown.classList.add('hidden');
  activeCat='all'; renderCats(); renderProducts(); updateCartUI();
  showToast(`الفرع: ${b} • التوصيل ${money(deliveryOf(b))}`,'info');
}
document.addEventListener('click',e=>{
  if(!e.target.closest('#branchWrap')) branchDropdown.classList.add('hidden');
  if(cartOpen && !e.target.closest('#cartPanel') && !e.target.closest('#fabCart') && !e.target.closest('nav')) closeCart();
});

/* ============ الأقسام ============ */
function renderCats(){
  document.querySelectorAll('.category-btn').forEach(b=>{
    const on=b.dataset.category===activeCat;
    b.className='category-btn px-5 py-2 rounded-full text-sm font-medium transition '+
      (on?'bg-gold-400/25 border border-gold-400/45 text-gold-100'
         :'bg-white/5 border border-gold-400/15 text-gold-100/50 hover:bg-gold-400/10');
  });
}
function filterCategory(c){activeCat=c;renderCats();renderProducts();}

/* ============ المنتجات ============ */
const catLabel=c=>({men:'رجالي',women:'نسائي',kids:'أطفال',accessories:'إكسسوارات'}[c]||c);
function renderProducts(){
  const list=productsData[selectedBranch]||[];
  const items=activeCat==='all'?list:list.filter(p=>p.category===activeCat);
  if(!items.length){
    productsGrid.innerHTML=`<div class="col-span-full text-center py-20">
      <i class="fas fa-box-open text-5xl text-gold-400/35 mb-4"></i>
      <p class="text-gold-100/50 text-lg">لا توجد منتجات في هذا القسم حالياً</p></div>`;return;
  }
  productsGrid.innerHTML=items.map(p=>`
    <div class="product-card rounded-2xl cursor-pointer" onclick="openModal(${p.id})">
      <div class="thumb h-32 md:h-40 flex items-center justify-center">
        <i class="fas ${p.icon}"></i>
        <span class="absolute top-2.5 right-2.5 z-[3] px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-black/45 border border-gold-400/30 text-gold-200">${catLabel(p.category)}</span>
      </div>
      <div class="p-3.5">
        <h3 class="font-bold text-[13px] md:text-[15px] mb-1 line-clamp-1">${p.name}</h3>
        <p class="text-gold-400 font-black text-base md:text-lg">${money(p.price)}</p>
        <div class="add-btn gold-btn mt-2.5 w-full py-2.5 rounded-xl font-bold text-[13px] flex items-center justify-center gap-2 pointer-events-none">
          <i class="fas fa-cart-plus"></i> اطلب الآن</div>
      </div>
    </div>`).join('');
}

/* ============ نافذة المنتج ============ */
function openModal(id){
  const p=(productsData[selectedBranch]||[]).find(x=>x.id===id); if(!p)return;
  currentProduct=p;
  modalIcon.className='fas '+p.icon;
  modalCat.textContent=catLabel(p.category);
  modalProductName.textContent=p.name;
  modalProductPrice.textContent=money(p.price);
  selectedSize='';selectedColor='';quantity=1;modalQty.textContent=1;
  document.querySelectorAll('.size-btn,.color-option').forEach(b=>b.classList.remove('active'));
  productModal.classList.remove('hidden');document.body.style.overflow='hidden';
}
function closeProductModal(){productModal.classList.add('hidden');document.body.style.overflow='';currentProduct=null;}
productModal.addEventListener('click',e=>{if(e.target===productModal)closeProductModal();});
function selSize(b,s){document.querySelectorAll('.size-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');selectedSize=s;}
function selColor(b,c){document.querySelectorAll('.color-option').forEach(x=>x.classList.remove('active'));b.classList.add('active');selectedColor=c;}
function chgQty(d){quantity=Math.max(1,quantity+d);modalQty.textContent=quantity;}

/* ============ السلة ============ */
function addToCart(){
  if(!selectedSize)return showToast('يرجى اختيار المقاس','error');
  if(!selectedColor)return showToast('يرجى اختيار اللون','error');
  const i=cart.findIndex(x=>x.id===currentProduct.id&&x.size===selectedSize&&x.color===selectedColor);
  if(i>-1)cart[i].qty+=quantity;
  else cart.push({id:currentProduct.id,name:currentProduct.name,price:currentProduct.price,
    icon:currentProduct.icon,size:selectedSize,color:selectedColor,qty:quantity});
  const n=currentProduct.name;
  updateCartUI(true);closeProductModal();
  showToast(`تمت إضافة "${n}" إلى السلة`,'success');
}
function updQty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);updateCartUI();}
function remItem(i){const n=cart[i].name;cart.splice(i,1);updateCartUI();showToast(`تم حذف "${n}"`,'info');}

function totals(){
  const sub=cart.reduce((s,i)=>s+i.price*i.qty,0);
  const del=cart.length?deliveryOf(selectedBranch):0;
  return{sub,del,grand:sub+del,count:cart.reduce((s,i)=>s+i.qty,0)};
}
function updateCartUI(pop){
  const t=totals();
  [cartCount,cartCountFab].forEach(el=>{
    if(t.count>0){el.textContent=t.count;el.classList.remove('hidden');
      if(pop){el.classList.remove('badge-pop');void el.offsetWidth;el.classList.add('badge-pop');}}
    else el.classList.add('hidden');});
  cartCountPanel.textContent=t.count;
  cartSubtotal.textContent=money(t.sub);
  cartDelivery.textContent=money(t.del);
  cartTotal.textContent=money(t.grand);
  cartBranchName.textContent=selectedBranch||'—';

  if(!cart.length){
    cartItems.innerHTML=`<div class="flex flex-col items-center justify-center py-10 text-center">
      <i class="fas fa-shopping-bag text-4xl text-gold-400/30 mb-3"></i>
      <h3 class="text-sm font-bold text-gold-100/55 mb-1">السلة فارغة</h3>
      <p class="text-gold-100/30 text-xs">أضف بعض القطع الرائعة!</p></div>`;
    cartFooter.classList.add('hidden');return;
  }
  cartFooter.classList.remove('hidden');
  cartItems.innerHTML=cart.map((it,i)=>`
    <div class="cart-item rounded-xl p-2.5 flex gap-2.5">
      <div class="mini-thumb w-14 h-14 rounded-lg flex items-center justify-center flex-shrink-0">
        <i class="fas ${it.icon}"></i></div>
      <div class="flex-1 min-w-0">
        <h4 class="font-bold text-[13px] truncate">${it.name}</h4>
        <div class="flex items-center gap-1.5 mt-1 text-[10px] text-gold-100/55">
          <span class="px-2 py-0.5 rounded-full bg-gold-400/12 border border-gold-400/20">${it.size}</span>
          <span class="px-2 py-0.5 rounded-full bg-gold-400/12 border border-gold-400/20">${it.color}</span>
        </div>
        <div class="flex items-center justify-between mt-1.5">
          <div class="flex items-center gap-1.5">
            <button onclick="updQty(${i},-1)" class="w-6 h-6 rounded-md bg-white/8 border border-gold-400/20 flex items-center justify-center hover:bg-gold-400/25"><i class="fas fa-minus text-[9px]"></i></button>
            <span class="font-bold text-xs w-5 text-center">${it.qty}</span>
            <button onclick="updQty(${i},1)" class="w-6 h-6 rounded-md bg-white/8 border border-gold-400/20 flex items-center justify-center hover:bg-gold-400/25"><i class="fas fa-plus text-[9px]"></i></button>
          </div>
          <span class="text-gold-400 font-bold text-xs">${money(it.price*it.qty)}</span>
        </div>
      </div>
      <button onclick="remItem(${i})" class="self-start w-7 h-7 rounded-md bg-red-500/12 text-red-400 flex items-center justify-center hover:bg-red-500/25 transition">
        <i class="fas fa-trash-alt text-[10px]"></i></button>
    </div>`).join('');
}

function toggleCart(e){e&&e.stopPropagation();cartOpen?closeCart():openCart();}
function openCart(){cartOpen=true;cartPanel.classList.remove('closed');fabIcon.className='fas fa-times text-xl';}
function closeCart(){cartOpen=false;cartPanel.classList.add('closed');fabIcon.className='fas fa-shopping-bag text-xl';}

/* ============ إتمام الطلب ============ */
function checkout(){
  const name=customerName.value.trim(),phone=customerPhone.value.trim();
  if(!name){showToast('يرجى إدخال الاسم الكامل','error');customerName.focus();return;}
  if(!phone){showToast('يرجى إدخال رقم الهاتف','error');customerPhone.focus();return;}
  if(!cart.length){showToast('السلة فارغة!','error');return;}
  const t=totals();
  let m=`👑 *طلب جديد من متجر نور للملابس*\n━━━━━━━━━━━━━━━━━━\n\n`;
  m+=`📍 *الفرع:* ${selectedBranch}\n👤 *اسم العميل:* ${name}\n📞 *رقم الهاتف:* ${phone}\n\n`;
  m+=`🛒 *تفاصيل الطلب:*\n──────────────\n`;
  cart.forEach((it,i)=>{
    m+=`\n${i+1}. *${it.name}*\n   📏 المقاس: ${it.size}\n   🎨 اللون: ${it.color}\n   📦 الكمية: ${it.qty}\n   💰 السعر: ${money(it.price*it.qty)}\n`;});
  m+=`\n──────────────\n🧾 المجموع الفرعي: ${money(t.sub)}\n🚚 رسوم التوصيل (${selectedBranch}): ${money(t.del)}\n💵 *الإجمالي النهائي: ${money(t.grand)}*\n\n━━━━━━━━━━━━━━━━━━\n✨ شكراً لتسوقكم من متجر نور!`;
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(m)}`,'_blank');
  showToast('جاري تحويلك إلى الواتساب...','success');
}

/* ============ التنبيهات ============ */
function showToast(msg,type='info'){
  const ic={success:'fas fa-check-circle text-emerald-400',error:'fas fa-exclamation-circle text-red-400',info:'fas fa-info-circle text-gold-400'};
  const bd={success:'border-emerald-500/35',error:'border-red-500/35',info:'border-gold-400/35'};
  const t=document.createElement('div');
  t.className=`toast flex items-center gap-3 px-5 py-3 rounded-2xl bg-[#120c05]/97 border ${bd[type]} shadow-2xl`;
  t.innerHTML=`<i class="${ic[type]}"></i><span class="text-sm font-medium">${msg}</span>`;
  toastContainer.appendChild(t);setTimeout(()=>t.remove(),3100);
}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeProductModal();closeCart();}});
renderCats();updateCartUI();
</script>
